name: Build Windows app

# Pushing a version tag (or publishing a release in the browser) makes GitHub
# build PumpControl.exe on a real Windows machine and attach it to the release.
# You never install PyInstaller yourself.
#
# Want a Mac build too? Add a second job on runs-on: macos-latest and put it in
# the release job's "needs" list. Only worth it if somebody will actually run
# this on a Mac.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pyserial openpyxl
      - run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name PumpControl
          --hidden-import serial.tools.list_ports_windows
          pump_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PumpControl.exe

  release:
    needs: [windows]
    runs-on: ubuntu-latest
    # Only publish for version tags. Running this by hand from the Actions tab
    # just builds the app, which is a useful way to test without publishing.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Create the release if it does not exist (tag pushed from git). If you
      # made it in the browser first, the create fails harmlessly and the
      # upload still attaches the app.
      - run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" artifacts/windows/PumpControl.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
