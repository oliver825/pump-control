name: Build apps

# Publishing a release (or pushing a tag like v1.0) makes GitHub build the app
# on a real Windows machine and two real Macs, then attach all three to the
# release. You do not need a Mac and you never install PyInstaller yourself.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pyserial openpyxl
      - run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name PumpControl
          --hidden-import serial.tools.list_ports_windows
          pump_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PumpControl.exe

  macos:
    # A Mac build failing must never block the Windows release, so this job is
    # allowed to fail. The release step attaches whatever actually got built.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon. Intel needs its own runner because
          # the two produce incompatible binaries.
          - runner: macos-latest
            arch: AppleSilicon
          # macos-13 was retired in December 2025. macos-15-intel replaced it
          # and is the last Intel image, available until August 2027.
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pyserial openpyxl
      - run: >
          pyinstaller --windowed --clean --noconfirm
          --name PumpControl
          --hidden-import serial.tools.list_ports_posix
          pump_app.py
      # A .app is a folder, so it has to be zipped or the download is useless.
      # ditto preserves the bundle structure; plain zip can mangle it.
      - run: >
          ditto -c -k --keepParent dist/PumpControl.app
          dist/PumpControl-mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/PumpControl-mac-${{ matrix.arch }}.zip

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    # Only publish for version tags. Running this by hand from the Actions tab
    # just builds the apps, which is a useful way to test without publishing.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true
          FILES=""
          for f in artifacts/windows/PumpControl.exe \
                   artifacts/macos-AppleSilicon/PumpControl-mac-AppleSilicon.zip \
                   artifacts/macos-Intel/PumpControl-mac-Intel.zip; do
            if [ -f "$f" ]; then FILES="$FILES $f"; else echo "::warning::missing $f"; fi
          done
          if [ -z "$FILES" ]; then echo "nothing was built"; exit 1; fi
          gh release upload "$GITHUB_REF_NAME" $FILES --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
